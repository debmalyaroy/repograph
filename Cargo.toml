[package]
name = "repograph"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Competition-schema code graphs for Python repositories: rebuild the official Gemma 4 Developer Agent graphs, embed, search, mine and verify SWE-style tasks"
repository = "https://github.com/debmalyaroy/repograph"
readme = "README.md"
keywords = ["code-graph", "swe-bench", "tree-sitter", "gemma", "benchmark"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "repograph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
flate2 = "1"
tar = "0.4"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
nalgebra = "0.33"
fastembed = { version = "7.1", optional = true, default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }

[features]
default = []
# `embed-probe` (compare open text encoders with the official vectors) pulls fastembed + onnxruntime
textembed = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
